apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/external-secrets/charts
      chart: external-secrets
      targetRevision: 2.15.0
      helm:
        valueFiles:
          - $values/secrets/values.yaml
    - repoURL: https://github.com/prateekjaindev/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/prateekjaindev/homelab.git
      targetRevision: main
      path: secrets
      directory:
        include: tls.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Some CRDs are too big for client-side apply's annotation.
      - ServerSideApply=true
