# The ClusterSecretStore and every ExternalSecret. Their CRDs come from the
# external-secrets Application, so the first sync may run before they exist:
# skip the dry run for them and retry until they do.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/prateekjaindev/homelab.git
    targetRevision: main
    path: secrets/external-secrets
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
