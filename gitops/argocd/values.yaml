# Argo CD (chart argo-cd 10.18.0, Argo CD v3.6.1) on cybertron.
# Installed once with helm, then gitops/apps/argocd.yaml takes it over.

global:
  domain: argocd.lab.prateek.cloud

configs:
  params:
    # The internal Gateway terminates TLS with the *.lab wildcard certificate.
    server.insecure: true
  # The OCI copies of two charts. Their classic repos on GitHub Pages have big
  # index files that took longer than the repo server's 90 s limit to download.
  # Public, so no credentials.
  repositories:
    argo-helm:
      name: argo-helm
      url: ghcr.io/argoproj/argo-helm
      type: helm
      enableOCI: "true"
    victoriametrics:
      name: victoriametrics
      url: ghcr.io/victoriametrics/helm-charts
      type: helm
      enableOCI: "true"
    external-secrets:
      name: external-secrets
      url: ghcr.io/external-secrets/charts
      type: helm
      enableOCI: "true"

# No single sign-on.
dex:
  enabled: false

# Sync failures and degraded Applications go to a Discord channel.
notifications:
  enabled: true
  argocdUrl: https://argocd.lab.prateek.cloud
  # argocd-notifications-secret holds the Discord webhook URL. External
  # Secrets creates it from Bitwarden (secrets/external-secrets/).
  secret:
    create: false
  notifiers:
    service.webhook.discord: |
      url: $discord-webhook-url
      headers:
        - name: Content-Type
          value: application/json
  subscriptions:
    - recipients:
        - discord
      triggers:
        - on-sync-failed
        - on-health-degraded
  templates:
    template.discord-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {"content": ":red_circle: Sync failed: **{{.app.metadata.name}}** ({{.app.status.operationState.phase}})\n{{.context.argocdUrl}}/applications/argocd/{{.app.metadata.name}}"}
    template.discord-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {"content": ":warning: Degraded: **{{.app.metadata.name}}**\n{{.context.argocdUrl}}/applications/argocd/{{.app.metadata.name}}"}
  triggers:
    trigger.on-sync-failed: |
      - description: The sync failed
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [discord-sync-failed]
    trigger.on-health-degraded: |
      - description: The Application is Degraded
        when: app.status.health.status == 'Degraded'
        send: [discord-health-degraded]

# No ApplicationSets on this cluster.
applicationSet:
  replicas: 0

# The UI on the LAN Gateway from Part 2: LAN and tailnet only.
server:
  httproute:
    enabled: true
    parentRefs:
      - name: internal
        namespace: gateway
        sectionName: https
    hostnames:
      - argocd.lab.prateek.cloud
  # A second Service port that speaks HTTP/2 without TLS (h2c) to the same
  # container port. Cilium's Envoy turns the CLI's gRPC-web calls back into
  # gRPC, and Argo CD only treats a request as gRPC over HTTP/2.
  service:
    servicePortHttp2: 8080
    servicePortHttp2AppProtocol: kubernetes.io/h2c

extraObjects:
  # gRPC requests for the same name go to the h2c port; everything else
  # (the UI) stays on the route above. The header match makes this route win.
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd-server-grpc
      namespace: argocd
    spec:
      parentRefs:
        - name: internal
          namespace: gateway
          sectionName: https
      hostnames:
        - argocd.lab.prateek.cloud
      rules:
        - matches:
            - headers:
                - name: content-type
                  type: RegularExpression
                  value: "^application/grpc.*"
          backendRefs:
            - name: argocd-server
              port: 8080
