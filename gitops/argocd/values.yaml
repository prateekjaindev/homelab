# Argo CD (chart argo-cd 10.18.0, Argo CD v3.6.1) on cybertron.
# Installed once with helm, then gitops/apps/argocd.yaml takes it over.

global:
  domain: argocd.lab.prateek.cloud

configs:
  params:
    # The internal Gateway terminates TLS with the *.lab wildcard certificate.
    server.insecure: true

# No single sign-on and no sync messages yet.
dex:
  enabled: false
notifications:
  enabled: false

# No ApplicationSets on this cluster.
applicationSet:
  replicas: 0

# The UI on the LAN Gateway from Part 2: LAN and tailnet only.
server:
  httproute:
    enabled: true
    parentRefs:
      - name: internal
        namespace: gateway
        sectionName: https
    hostnames:
      - argocd.lab.prateek.cloud
  # A second Service port that speaks HTTP/2 without TLS (h2c) to the same
  # container port. Cilium's Envoy turns the CLI's gRPC-web calls back into
  # gRPC, and Argo CD only treats a request as gRPC over HTTP/2.
  service:
    servicePortHttp2: 8080
    servicePortHttp2AppProtocol: kubernetes.io/h2c

extraObjects:
  # gRPC requests for the same name go to the h2c port; everything else
  # (the UI) stays on the route above. The header match makes this route win.
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd-server-grpc
      namespace: argocd
    spec:
      parentRefs:
        - name: internal
          namespace: gateway
          sectionName: https
      hostnames:
        - argocd.lab.prateek.cloud
      rules:
        - matches:
            - headers:
                - name: content-type
                  type: RegularExpression
                  value: "^application/grpc.*"
          backendRefs:
            - name: argocd-server
              port: 8080
