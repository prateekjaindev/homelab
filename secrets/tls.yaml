# A private CA for one in-cluster TLS hop: the External Secrets controller
# calling bitwarden-sdk-server. Nothing outside the cluster trusts it.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: external-secrets
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-ca
  namespace: external-secrets
spec:
  isCA: true
  commonName: bitwarden-sdk-server-ca
  secretName: bitwarden-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bitwarden-ca
  namespace: external-secrets
spec:
  ca:
    secretName: bitwarden-ca
---
# The chart mounts this Secret's tls.crt and tls.key. Its ca.crt is what the
# ClusterSecretStore trusts.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-tls-certs
  namespace: external-secrets
spec:
  secretName: bitwarden-tls-certs
  dnsNames:
    - bitwarden-sdk-server.external-secrets.svc.cluster.local
    - bitwarden-sdk-server.external-secrets.svc
    - bitwarden-sdk-server
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: bitwarden-ca
    kind: Issuer
