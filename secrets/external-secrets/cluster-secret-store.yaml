# One store for the whole cluster: the cybertron project in Bitwarden Secrets
# Manager. The machine account behind the token can only read that project.
#
# Secret external-secrets/bitwarden-access-token (created manually, the only
# Secret that is):
#   token  the machine account's access token
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      organizationID: 7540d8e7-d6ed-4ff6-bbb9-b50900baff1b
      projectID: fe40e82b-8736-444e-a263-b50900bb401f
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets
        key: ca.crt
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            namespace: external-secrets
            key: token
