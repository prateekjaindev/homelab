# Alertmanager's whole config (Part 6), built from a template: only the
# Telegram token, chat ID and Healthchecks.io ping URL come from Bitwarden.
# Same routes as observability/alertmanager.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: alertmanager-config
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          route:
            receiver: telegram
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - matchers: [alertname = "Watchdog"]
                receiver: healthchecks
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
              - matchers: [alertname = "InfoInhibitor"]
                receiver: blackhole
          receivers:
            - name: telegram
              telegram_configs:
                - bot_token: {{ .botToken | quote }}
                  chat_id: {{ .chatId }}
                  send_resolved: true
            - name: healthchecks
              webhook_configs:
                - url: {{ .pingUrl | quote }}
                  send_resolved: false
            - name: blackhole
          inhibit_rules:
            - source_matchers: [severity = "critical"]
              target_matchers: [severity = "warning"]
              equal: [alertname, namespace]
            - source_matchers: [alertname = "InfoInhibitor"]
              target_matchers: [severity = "info"]
              equal: [namespace]
  data:
    - secretKey: botToken
      remoteRef:
        key: telegram-bot-token
    - secretKey: chatId
      remoteRef:
        key: telegram-chat-id
    - secretKey: pingUrl
      remoteRef:
        key: healthchecks-ping-url
