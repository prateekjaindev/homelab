# The shared Cloudflare Tunnel's credentials (Part 2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-cybertron
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: cloudflared-cybertron
  data:
    - secretKey: TUNNEL_ID
      remoteRef:
        key: cloudflared-tunnel-id
    - secretKey: credentials.json
      remoteRef:
        key: cloudflared-credentials-json
