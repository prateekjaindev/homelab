# External Secrets Operator (chart external-secrets 2.15.0) on cybertron.
# Installed by Argo CD from gitops/apps/external-secrets.yaml.

# The Bitwarden Secrets Manager provider talks to Bitwarden through this
# small server (it wraps Bitwarden's Rust SDK). It only serves HTTPS, with the
# bitwarden-tls-certs Secret that tls.yaml asks cert-manager for.
bitwarden-sdk-server:
  enabled: true
