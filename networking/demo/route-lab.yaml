# LAN only: https://whoami.lab.prateek.cloud through the internal Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-lab
  namespace: demo
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - whoami.lab.prateek.cloud
  rules:
    - backendRefs:
        - name: whoami
          port: 80
