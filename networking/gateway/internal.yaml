# The LAN front door: https://<app>.lab.prateek.cloud on 192.168.1.201.
# DNS: *.lab.prateek.cloud A 192.168.1.201, DNS only (grey cloud) in Cloudflare.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.1.201
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.prateek.cloud"
      allowedRoutes:
        namespaces:
          from: Same # only the redirect below
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.prateek.cloud"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All # any namespace may publish a lab app
---
# Plain HTTP on the lab names only redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: internal
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
