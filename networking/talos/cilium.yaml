# Hand pod networking and Service load balancing to Cilium.
#
# Cybertron's machine config was generated by talosctl 1.13, so it uses the
# v1alpha1 `cluster.network` / `cluster.proxy` fields. A config generated by
# talosctl 1.14 or later uses separate documents instead:
#
#   apiVersion: v1alpha1
#   kind: KubeFlannelCNIConfig
#   $patch: delete
#   ---
#   apiVersion: v1alpha1
#   kind: KubeProxyConfig
#   enabled: false
#
# Keep this file with the other node patches so a regenerated config keeps it.
cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
