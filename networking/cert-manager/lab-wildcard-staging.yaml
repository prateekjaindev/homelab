# Dry run against Let's Encrypt staging (generous rate limits, untrusted cert).
# Delete it once it reaches Ready, then apply ../gateway/lab-wildcard.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-wildcard-staging
  namespace: gateway
spec:
  secretName: lab-wildcard-staging-tls
  dnsNames:
    - "*.lab.prateek.cloud"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging
